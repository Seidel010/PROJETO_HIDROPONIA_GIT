<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HidroVerde - Cultivo Inteligente</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #a8e063 0%, #56ab2f 100%);
            min-height: 100vh;
            display: flex;
        }

        .sidebar {
            width: 220px;
            background: rgba(255, 255, 255, 0.95);
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 2px 0 10px rgba(0,0,0,0.1);
        }

        .logo {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 30px;
        }

        .logo-icon {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #56ab2f 0%, #a8e063 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
        }

        .logo-text {
            font-size: 20px;
            font-weight: bold;
            color: #2d5016;
        }

        .menu-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
        }

        .menu-item {
            padding: 14px 20px;
            background: linear-gradient(135deg, #56ab2f 0%, #a8e063 100%);
            color: white;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
            font-size: 15px;
            font-weight: 500;
        }

        .menu-item:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(86, 171, 47, 0.4);
        }

        .content {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
        }

        .main-card {
            background: rgba(255, 255, 255, 0.9);
            padding: 60px 80px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            text-align: center;
        }

        .main-title {
            font-size: 48px;
            color: #2d5016;
            margin-bottom: 20px;
        }

        .subtitle {
            font-size: 20px;
            color: #56ab2f;
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="logo">
            <div class="logo-icon">🌱</div>
            <div class="logo-text">HidroVerde</div>
        </div>
        <div class="menu-container">
            <div class="menu-item">🏠 Início</div>
            <div class="menu-item">📊 Monitoramento</div>
            <div class="menu-item">💧 Nutrientes</div>
            <div class="menu-item">⚙️ Configurações</div>
        </div>
    </div>
    
    <div class="content">
        <div class="main-card">
            <h1 class="main-title">Cultivo Inteligente</h1>
            <p class="subtitle">Sistema de Hidroponia Automatizado</p>
        </div>
    </div>
</body>
</html>
